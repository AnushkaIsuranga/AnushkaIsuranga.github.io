name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Replace placeholders in built HTML
        run: node -e "
          const fs = require('fs');
          const portfolio = require('./src/content/portfolio.json');
          
          const htmlPath = './dist/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');
          
          html = html.replaceAll('%SITE_NAME%', portfolio.site.name);
          html = html.replaceAll('%SITE_ROLE%', portfolio.site.role);
          html = html.replaceAll('%SITE_TITLE%', \`\${portfolio.site.name} | \${portfolio.site.role}\`);
          
          fs.writeFileSync(htmlPath, html, 'utf8');
          console.log('✓ Placeholders replaced successfully');
        

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
