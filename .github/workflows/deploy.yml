name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Replace placeholders
        run: |
          node <<'EOF'
          const fs = require('fs');

          const portfolio = JSON.parse(
            fs.readFileSync('./src/content/portfolio.json','utf8')
          );

          const htmlPath = './dist/index.html';
          let html = fs.readFileSync(htmlPath, 'utf8');

          html = html.replaceAll('%SITE_NAME%', portfolio.site.name);
          html = html.replaceAll('%SITE_ROLE%', portfolio.site.role);
          html = html.replaceAll('%SITE_TITLE%', `${portfolio.site.name} | ${portfolio.site.role}`);

          fs.writeFileSync(htmlPath, html);
          console.log('✓ Placeholders replaced successfully');
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4